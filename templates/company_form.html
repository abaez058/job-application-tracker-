{% extends "base.html" %}
{% block title %}{{ 'Edit company' if company else 'Add company' }}{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('companies') }}">&larr; All companies</a>
<h1>{{ 'Edit company' if company else 'Add company' }}</h1>

<form class="card form" method="post" novalidate>
    <div class="field">
        <label for="company_name">Company name <span class="req">*</span></label>
        <input id="company_name" name="company_name" maxlength="100" required value="{{ form.company_name or '' }}">
    </div>
    <div class="field-row">
        <div class="field">
            <label for="industry">Industry</label>
            <input id="industry" name="industry" maxlength="50" value="{{ form.industry or '' }}">
        </div>
        <div class="field">
            <label for="website">Website</label>
            <input id="website" name="website" type="url" maxlength="200" placeholder="https://" value="{{ form.website or '' }}">
        </div>
    </div>
    <div class="field-row">
        <div class="field">
            <label for="city">City</label>
            <input id="city" name="city" maxlength="50" value="{{ form.city or '' }}">
        </div>
        <div class="field">
            <label for="state">State</label>
            <input id="state" name="state" maxlength="50" value="{{ form.state or '' }}">
        </div>
    </div>
    <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4">{{ form.notes or '' }}</textarea>
    </div>
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">{{ 'Save changes' if company else 'Add company' }}</button>
        <a class="btn" href="{{ url_for('companies') }}">Cancel</a>
    </div>
</form>
{% endblock %}
