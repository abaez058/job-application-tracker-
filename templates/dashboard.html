{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="page-head">
    <h1>Dashboard</h1>
</div>

<section class="stat-grid" aria-label="Totals">
    <div class="stat">
        <span class="stat-value">{{ counts.companies }}</span>
        <span class="stat-label">Companies</span>
    </div>
    <div class="stat">
        <span class="stat-value">{{ counts.jobs }}</span>
        <span class="stat-label">Jobs saved</span>
    </div>
    <div class="stat">
        <span class="stat-value">{{ counts.applications }}</span>
        <span class="stat-label">Applications</span>
    </div>
    <div class="stat">
        <span class="stat-value">{{ counts.contacts }}</span>
        <span class="stat-label">Contacts</span>
    </div>
</section>
{% endblock %}
